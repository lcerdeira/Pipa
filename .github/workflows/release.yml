name: Build Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-ARM64
          - platform: macos-13
            target: x86_64-apple-darwin
            label: macOS-Intel
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: |
          cd UI/DesktopPIPA
          yarn install

      - name: Build SPA
        run: |
          cd UI/DesktopPIPA
          npx quasar build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: UI/DesktopPIPA
          tagName: ${{ github.ref_name }}
          releaseName: 'PIPA ${{ github.ref_name }}'
          releaseBody: |
            PIPA Desktop - Pipeline for Microbial Genomic Analysis

            ## Installation
            1. Download the installer for your platform below
            2. Install and launch PIPA
            3. The app will start a local Flask backend automatically
            4. **Note**: You need Python 3 and the bioinformatics tools installed separately (see documentation)

            For the full pipeline with all tools pre-installed, use Docker:
            ```
            docker-compose up -d
            ```

            [Full Documentation](https://pipa.readthedocs.io)
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipa-${{ matrix.label }}
          path: |
            UI/DesktopPIPA/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            UI/DesktopPIPA/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            UI/DesktopPIPA/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            UI/DesktopPIPA/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            UI/DesktopPIPA/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            UI/DesktopPIPA/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe

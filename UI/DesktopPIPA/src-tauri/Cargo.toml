[package]
name = "pipa"
version = "2.0.0"
description = "PIPA - Pipeline for Microbial Genomic Analysis"
authors = ["Louise Cerdeira <Louise.Cerdeira@gmail.com>"]
license = "GPL-3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["http-request", "fs-read-dir", "fs-read-file", "shell-sidecar", "shell-execute", "shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

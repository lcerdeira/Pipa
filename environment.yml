name: pipa
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.10,<3.13
  - flask>=2.3
  - flask-cors>=4.0
  - werkzeug>=2.3
  - pip

  # Trimming
  - trim-galore
  - porechop_abi

  # Assembly
  - spades>=4.0
  - flye
  - canu

  # General Annotation
  - prokka
  - bakta
  - eggnog-mapper
  - mlst
  - barrnap
  - trnascan-se
  - kofamscan

  # Assembly Quality
  - busco>=5.7
  - checkm-genome
  - quast

  # Resistance & Virulence
  - abricate
  - ncbi-amrfinderplus

  # Mobile Elements & Defense
  - plasmidfinder
  - mob_suite
  - phigaro
  - phispy
  - ismapper

  # Organism-Specific Typing
  - kleborate
  - staphopia-sccmec
  # tb-profiler removed: pathogen-profiler dependency conflict
  # Install separately: conda create -n tbprofiler tb-profiler
  - ectyper
  - emmtyper
  - genotyphi
  - hicap
  - hpsuissero
  - legsta
  - lissero
  - meningotype
  - ngmaster
  - pasty
  - pbptyper
  - sccmec
  - seqsero2
  - seroba
  - shigatyper
  - shigeifinder
  - sistr_cmd
  - spatyper
  - ssuissero
  - stecfinder

  # Utilities
  - samtools
  - bcftools

  # pip-only tools
  - pip:
    - defense-finder-cli
    - mcroni
    - shigapass
    - clermontyping

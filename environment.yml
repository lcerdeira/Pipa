name: pipa
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.10,<3.13
  - flask>=2.3
  - flask-cors>=4.0
  - werkzeug>=2.3
  - pip

  # Trimming
  - trim-galore
  - porechop_abi

  # Assembly
  - spades>=4.0
  - flye
  - canu

  # General Annotation
  - prokka
  - bakta
  - eggnog-mapper
  - mlst
  - barrnap
  - trnascan-se
  - kofamscan

  # Assembly Quality
  - busco>=5.7
  - checkm-genome
  - quast

  # Resistance & Virulence
  - abricate
  - ncbi-amrfinderplus

  # Mobile Elements & Defense
  - plasmidfinder
  - mob_suite
  - phigaro
  - phispy
  - ismapper

  # Organism-Specific Typing (conda-compatible)
  - kleborate
  - staphopia-sccmec
  - ectyper
  - emmtyper
  - genotyphi
  - hicap
  - hpsuissero
  - legsta
  - lissero
  - meningotype
  - ngmaster
  - pasty
  - pbptyper
  - sccmec
  - seqsero2
  - sistr_cmd
  - spatyper
  - stecfinder

  # Utilities
  - samtools
  - bcftools

  # pip installs (tools with conda conflicts, installed from GitHub/PyPI)
  - pip:
    - defense-finder-cli
    - mcroni
    - shigapass
    - clermontyping
    - git+https://github.com/rrwick/Unicycler.git
    - git+https://github.com/jodyphelan/TBProfiler.git
    - git+https://github.com/sanger-pathogens/seroba.git
    - git+https://github.com/CFSAN-Biostatistics/shigatyper.git
    - git+https://github.com/LanLab/ShigEiFinder.git
    - git+https://github.com/jimmyliu1326/SsuisSero.git
